<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Agenda de audiencias y gestión de causas penales para estudios de defensa."
    />
    <meta name="theme-color" content="#f4f7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d171c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Gestor de causas penales</title>
    <script>
      // Applies the saved theme before first paint (same key and rules as ThemeProvider).
      (function () {
        var theme = "system";
        try {
          theme = localStorage.getItem("theme") || "system";
        } catch (e) {}
        var dark =
          theme === "dark" ||
          (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
