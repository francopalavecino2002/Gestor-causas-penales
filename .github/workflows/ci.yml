name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Only PR runs are superseded; every push to main finishes so the badge never shows "cancelled".
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # Decides which stacks to build. A stack runs only if its folder exists and, on pull
  # requests, only if the folder (or this workflow) changed. Pushes to main and manual runs
  # build every stack that exists, so the README badge reflects the whole repository.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
      screenshots: ${{ steps.filter.outputs.screenshots }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            screenshots:
              - 'frontend/e2e-demo/screenshots.capture.ts'
            scripts:
              - 'scripts/**'
              - 'docker-compose.yml'
              - 'backend/Dockerfile*'
      - id: decide
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
          FRONTEND_CHANGED: ${{ steps.filter.outputs.frontend }}
        run: |
          should_run() {
            local marker="$1" changed="$2"
            if [ ! -f "$marker" ]; then echo false
            elif [ "$IS_PR" != "true" ]; then echo true
            else [ "$changed" = "true" ] && echo true || echo false
            fi
          }
          echo "backend=$(should_run backend/pom.xml "$BACKEND_CHANGED")" >> "$GITHUB_OUTPUT"
          echo "frontend=$(should_run frontend/package.json "$FRONTEND_CHANGED")" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers uses the Docker engine preinstalled on ubuntu-latest runners.
      - run: chmod +x mvnw && ./mvnw -B verify
      # JaCoCo coverage (unit + integration): line total in the job summary, full report as artifact.
      - name: Coverage summary
        run: |
          awk -F, 'NR > 1 { missed += $8; covered += $9 }
            END {
              total = missed + covered
              if (total == 0) { print "No coverage data in jacoco.csv"; exit 1 }
              printf "### Backend line coverage: %.1f%% (%d of %d lines)\n", 100 * covered / total, covered, total
            }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          if-no-files-found: error
          retention-days: 14

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # The demo flow (T32) end to end: real backend with the fictitious seed, Postgres from
  # docker-compose.yml and the production build of the frontend, driven by Playwright.
  # Also the backup smoke test (T64), which needs the seeded database this job leaves behind.
  e2e-demo:
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: chmod +x backend/mvnw && bash scripts/e2e-demo.sh
      - name: Back up and restore the seeded database
        run: bash scripts/backup-smoke.sh gestor_e2e
      # The screens of docs/DEMO.md against a fresh seed, on a manual run
      # (`gh workflow run ci.yml --ref <branch>`) or a PR that changes the capture, so they can be
      # refreshed without a local Docker setup: download the artifact into docs/screenshots/demo/.
      - name: Capture the demo screenshots
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.screenshots == 'true'
        run: bash scripts/e2e-demo.sh --screenshots
      - if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.screenshots == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: demo-screenshots
          path: docs/screenshots/demo/*.png
          if-no-files-found: error
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-demo-report
          path: |
            frontend/test-results/
            .demo-logs/
          retention-days: 7

  # The production image (T65): built and started with the prod profile, never pushed or deployed.
  docker-image:
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/docker-smoke.sh
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-smoke-logs
          path: .demo-logs/
          if-no-files-found: ignore
          retention-days: 7

  repo-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check shell scripts parse
        run: |
          shopt -s nullglob
          for script in scripts/*.sh; do
            echo "bash -n $script"
            bash -n "$script"
          done
      # shellcheck and pwsh are preinstalled on ubuntu-latest runners.
      - name: Lint the demo and backup scripts
        run: >-
          shellcheck scripts/demo.sh scripts/e2e-demo.sh scripts/backup.sh scripts/restore.sh
          scripts/backup-smoke.sh scripts/docker-smoke.sh
      - name: Check PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in Get-ChildItem scripts -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors)
            Write-Host "parse $($script.Name): $($errors.Count) error(s)"
            $errors | ForEach-Object { Write-Host "  $_" }
            if ($errors) { $failed = $true }
          }
          if ($failed) { exit 1 }
