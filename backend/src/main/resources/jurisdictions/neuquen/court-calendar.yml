# Court calendar of Neuquén (ADR-0017): the non-business days used by deadlines counted in business
# days (art. 79). Saturdays and Sundays are never business days and are not listed.
#
# Only the years listed under "years" are loaded: a business-day deadline that reaches another year
# is shown as "not calculable" instead of guessing. Add a year before it starts.
#
# National holidays follow Ley 27.399 (movable ones already moved). The bridge days (feriados
# puente) are decreed every year, and the judicial recesses (ferias) are set by the TSJ every year:
# both are tagged "validar", as is whether the criminal courts treat Holy Thursday and the recesses
# as non-business days.
#
# Known gap [validar]: provincial and local non-business days (for example a court holiday on the
# founding day of a city, or an asueto decreed by the TSJ) are not listed. Until they are, a
# business-day deadline can come out one day early: the lawyer controls.
source: Ley 27.399 (feriados nacionales) y acordadas del TSJ de Neuquén (ferias judiciales)
flags: [validar]
years: [2025, 2026, 2027]
days:
