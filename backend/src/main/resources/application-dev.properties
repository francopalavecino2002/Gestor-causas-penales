# Local development only: matches docker-compose.yml and .env.example.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/gestor_causas}
spring.datasource.username=${DB_USERNAME:gestor}
spring.datasource.password=${DB_PASSWORD:gestor}
# Fictitious development key ("dev-only-totp-key-not-for-prod!!"); never use it elsewhere.
app.security.two-factor.encryption-key=${TOTP_ENCRYPTION_KEY:ZGV2LW9ubHktdG90cC1rZXktbm90LWZvci1wcm9kISE=}
# "Probá gratis" is on while developing. The verification link is never logged: read it in Mailpit
# (docker compose --profile mail up -d mailpit, then MAIL_SMTP_HOST=localhost etc., see .env.example).
app.signup.enabled=${APP_SIGNUP_ENABLED:true}
