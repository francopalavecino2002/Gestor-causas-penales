# Production (T65, ADR-0046): activate with SPRING_PROFILES_ACTIVE=prod, never together with dev or
# demo (ProductionSafetyCheck refuses to start). Everything else comes from the environment: see the
# reference in .env.example and docs/HOSTING.md.

# Hosting platforms put a TLS proxy in front: trust its X-Forwarded-* headers so HTTPS is detected
# and the login throttle sees each visitor's address. Tomcat takes the rightmost untrusted address,
# so a client cannot spoof it by sending its own header.
server.forward-headers-strategy=native

# Stated again so a reader of this file sees it; ProductionSafetyCheck also rejects an override.
server.servlet.session.cookie.secure=true

# The schema only changes through Flyway migrations: Hibernate validates, Flyway never cleans.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.clean-disabled=true

# Let requests in flight finish when the platform stops the container.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Free and small managed databases allow few connections; a 1 to 5 lawyer firm needs few.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,application/problem+json,image/svg+xml
