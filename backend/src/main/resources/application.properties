spring.application.name=gestor-penal
server.port=8081

# No defaults on purpose: the app refuses to start without explicit credentials.
# For local development activate the "dev" profile (see application-dev.properties).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.mvc.problemdetails.enabled=true

# Session cookie for the SPA (ADR-0008). Browsers accept Secure cookies on http://localhost.
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=GP_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
# Absolute lifetime: even an active session must log in again after this (ActiveUserFilter).
app.security.session.max-age=12h
# Behind a reverse proxy, uncomment so client addresses (login throttle) and HTTPS are detected:
# server.forward-headers-strategy=native

# Failed-login limits (LoginThrottleProperties).
app.security.login.max-failures-per-account=5
app.security.login.max-failures-per-client=20
app.security.login.window=15m

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
