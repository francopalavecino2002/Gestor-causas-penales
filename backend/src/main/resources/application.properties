spring.application.name=gestor-penal
server.port=8081

# No defaults on purpose: the app refuses to start without explicit credentials.
# For local development activate the "dev" profile (see application-dev.properties).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.mvc.problemdetails.enabled=true

# Imports (ADR-0019): the app limits a file to 2 MB; the servlet limit is a bit above so the
# friendly 400 of ImportService is the one users normally see.
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

# Session cookie for the SPA (ADR-0008). Browsers accept Secure cookies on http://localhost.
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=GP_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
# Absolute lifetime: even an active session must log in again after this (ActiveUserFilter).
app.security.session.max-age=12h
# Behind a reverse proxy, set SERVER_FORWARD_HEADERS_STRATEGY=native (see .env.example) so client
# addresses (login throttle, public calculator rate limit) and HTTPS are detected. Without it every
# visitor behind the proxy shares one address and one rate limit.
# server.forward-headers-strategy=native

# Failed-login limits (LoginThrottleProperties).
app.security.login.max-failures-per-account=5
app.security.login.max-failures-per-client=20
app.security.login.window=15m

# Public deadline calculator without login (ADR-0041): requests per client address.
app.public.deadline-calculator.max-requests-per-client=30
app.public.deadline-calculator.window=1m

# Two-factor authentication (ADR-0009). The key encrypts TOTP secrets at rest: 32 random bytes in
# base64 (openssl rand -base64 32). No default on purpose; losing it disables every enrolled 2FA.
app.security.two-factor.encryption-key=${TOTP_ENCRYPTION_KEY}
# Time to enter the code after a valid password.
app.security.two-factor.login-timeout=5m

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Optional AI assistance (ADR-0033). Without a key it is unavailable for every firm; with one, each
# firm's owner still has to turn it on. The free tier of Gemini may use the texts to improve Google's
# products: use it only with fictitious data (demo), never with real cases.
app.ai.gemini-api-key=${GEMINI_API_KEY:}
app.ai.gemini-model=${GEMINI_MODEL:gemini-3.1-flash-lite}
app.ai.timeout=20s

# The address users open the app at, used to build links in emails (ADR-0049). Never taken from the
# request's Host header, which a visitor controls. In production: https://<your domain>.
app.public-url=${APP_PUBLIC_URL:http://localhost:5173}

# Password recovery by email (ADR-0049): link lifetime and request limits per firm + email and per
# client address. Using a link counts against the failed-login limits above.
app.security.password-reset.token-ttl=30m
app.security.password-reset.max-requests-per-account=3
app.security.password-reset.max-requests-per-client=10
app.security.password-reset.window=1h

# Outbound email (ADR-0048). Without MAIL_SMTP_HOST nothing is sent: each email is logged without its
# body and recorded as LOGGED. Any SMTP provider works; see docs/HOSTING.md. Locally, Mailpit from
# docker-compose.yml: MAIL_SMTP_HOST=localhost MAIL_SMTP_PORT=1025 MAIL_SMTP_SECURITY=NONE.
app.mail.from=${MAIL_FROM:no-reply@localhost}
app.mail.smtp.host=${MAIL_SMTP_HOST:}
app.mail.smtp.port=${MAIL_SMTP_PORT:587}
app.mail.smtp.username=${MAIL_SMTP_USERNAME:}
app.mail.smtp.password=${MAIL_SMTP_PASSWORD:}
app.mail.smtp.security=${MAIL_SMTP_SECURITY:STARTTLS}
app.mail.smtp.timeout=10s
