# One-time creation of the first firm and its owner (T66, ADR-0047). Run it once against an empty
# database, usually together with prod: SPRING_PROFILES_ACTIVE=prod,bootstrap. It refuses once any
# firm exists, prints the owner's temporary password and exits. See docs/HOSTING.md.

# A command, not a server: no port is opened, and the application exits when it is done.
spring.main.web-application-type=none

app.bootstrap.firm-name=${BOOTSTRAP_FIRM_NAME:}
app.bootstrap.firm-slug=${BOOTSTRAP_FIRM_SLUG:}
app.bootstrap.owner-email=${BOOTSTRAP_OWNER_EMAIL:}
app.bootstrap.owner-name=${BOOTSTRAP_OWNER_NAME:}
