services:
  postgres:
    image: postgres:18-alpine
    container_name: gestor-penal-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-gestor_causas}
      POSTGRES_USER: ${DB_USERNAME:-gestor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gestor}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
